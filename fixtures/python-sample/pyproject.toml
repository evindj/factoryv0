[project]
name = "sample"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PT", "C4", "RET"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
